  <text class="rc rdd c06" x="120" y="0" >9<tspan x="120" dy="14">4</tspan><tspan x="120" dy="14">0</tspan><tspan x="120" dy="14">B</tspan><tspan x="120" dy="14">E</tspan><tspan x="120" dy="14">7</tspan><tspan x="120" dy="14">3</tspan><tspan x="120" dy="14">F</tspan><tspan x="120" dy="14">2</tspan><tspan x="120" dy="14">A</tspan><tspan x="120" dy="14">6</tspan><tspan x="120" dy="14">D</tspan><tspan x="120" dy="14">1</tspan><tspan x="120" dy="14">C</tspan><tspan x="120" dy="14">5</tspan><tspan x="120" dy="14">8</tspan></text>
