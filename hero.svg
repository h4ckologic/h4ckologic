<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190">
  <defs>

    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.9" fill="#ffffff" opacity="0.055"/>
    </pattern>

    <!-- Subtle center glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#0d2818" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft glow on accent line only -->
    <filter id="lineBloom" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      /* Slow background pulse — barely perceptible */
      @keyframes bgPulse { 0%,100%{opacity:.55} 50%{opacity:.85} }
      .cg { animation: bgPulse 7s ease-in-out infinite; }

      /* Accent line draws left to right */
      @keyframes drawLine {
        0%   { stroke-dashoffset: 900; opacity: 0; }
        10%  { opacity: 1; }
        100% { stroke-dashoffset: 0; }
      }
      .topLine {
        stroke-dasharray: 900;
        stroke-dashoffset: 900;
        animation: drawLine 1.8s cubic-bezier(.4,0,.2,1) forwards;
      }
      .underline {
        stroke-dasharray: 340;
        stroke-dashoffset: 340;
        animation: drawLine 1.4s cubic-bezier(.4,0,.2,1) 0.3s forwards;
      }

      /* Title fades in and rises slightly */
      @keyframes fadeUp {
        0%  { opacity: 0; transform: translateY(6px); }
        100%{ opacity: 1; transform: translateY(0); }
      }
      .title    { animation: fadeUp .9s ease-out .1s both; }
      .sub      { animation: fadeUp .9s ease-out .35s both; }
      .tags     { animation: fadeUp .9s ease-out .55s both; }
      .meta     { animation: fadeUp .9s ease-out .7s  both; }

      /* Tag hover shimmer (subtle) */
      @keyframes tagPulse { 0%,100%{opacity:.85} 50%{opacity:1} }
      .tag { animation: tagPulse 4s ease-in-out infinite; }
      .tag:nth-child(2){ animation-delay:.8s  }
      .tag:nth-child(3){ animation-delay:1.6s }
      .tag:nth-child(4){ animation-delay:2.4s }
    </style>
  </defs>

  <!-- ▓ BACKGROUND ▓ -->
  <rect width="900" height="190" fill="#0d1117"/>

  <!-- Dot texture -->
  <rect width="900" height="190" fill="url(#dots)"/>

  <!-- Center radial glow — very dim green tint -->
  <rect class="cg" width="900" height="190" fill="url(#centerGlow)"/>

  <!-- ▓ TOP ACCENT LINE — draws across ▓ -->
  <line class="topLine" x1="0" y1="1.5" x2="900" y2="1.5"
        stroke="#3fb950" stroke-width="2.5" filter="url(#lineBloom)"/>

  <!-- Bottom edge — static, muted -->
  <line x1="0" y1="188.5" x2="900" y2="188.5"
        stroke="#21262d" stroke-width="1"/>

  <!-- ▓ TITLE ▓ -->
  <text class="title"
        font-family="'SF Mono','Fira Code','Cascadia Code','Courier New',monospace"
        font-size="62" font-weight="700" fill="#e6edf3" letter-spacing="-1"
        x="450" y="93" text-anchor="middle">h4ckologic</text>

  <!-- Green underline — animates in -->
  <line class="underline"
        x1="276" y1="100" x2="622" y2="100"
        stroke="#3fb950" stroke-width="2" filter="url(#lineBloom)"/>

  <!-- ▓ ROLE / SUBTITLE ▓ -->
  <text class="sub"
        font-family="'SF Mono','Fira Code','Courier New',monospace"
        font-size="13" fill="#8b949e" letter-spacing="0.5"
        x="450" y="124" text-anchor="middle">
    Security Researcher  ·  CVE Hunter  ·  Abu Dhabi, UAE
  </text>

  <!-- ▓ TAG PILLS ▓ -->
  <g class="tags">
    <!-- Mobile Security -->
    <g class="tag">
      <rect x="196" y="138" width="118" height="22" rx="5"
            fill="#161b22" stroke="#3fb950" stroke-width="0.75" stroke-opacity="0.5"/>
      <text font-family="'SF Mono','Fira Code','Courier New',monospace"
            font-size="11" fill="#3fb950" opacity=".85"
            x="255" y="153" text-anchor="middle">Mobile Security</text>
    </g>

    <!-- CVE Research -->
    <g class="tag">
      <rect x="324" y="138" width="104" height="22" rx="5"
            fill="#161b22" stroke="#3fb950" stroke-width="0.75" stroke-opacity="0.5"/>
      <text font-family="'SF Mono','Fira Code','Courier New',monospace"
            font-size="11" fill="#3fb950" opacity=".85"
            x="376" y="153" text-anchor="middle">CVE Research</text>
    </g>

    <!-- Bug Bounty -->
    <g class="tag">
      <rect x="438" y="138" width="94" height="22" rx="5"
            fill="#161b22" stroke="#3fb950" stroke-width="0.75" stroke-opacity="0.5"/>
      <text font-family="'SF Mono','Fira Code','Courier New',monospace"
            font-size="11" fill="#3fb950" opacity=".85"
            x="485" y="153" text-anchor="middle">Bug Bounty</text>
    </g>

    <!-- Fuzzing -->
    <g class="tag">
      <rect x="542" y="138" width="74" height="22" rx="5"
            fill="#161b22" stroke="#3fb950" stroke-width="0.75" stroke-opacity="0.5"/>
      <text font-family="'SF Mono','Fira Code','Courier New',monospace"
            font-size="11" fill="#3fb950" opacity=".85"
            x="579" y="153" text-anchor="middle">Fuzzing</text>
    </g>

    <!-- Reverse Engineering -->
    <g class="tag">
      <rect x="626" y="138" width="150" height="22" rx="5"
            fill="#161b22" stroke="#3fb950" stroke-width="0.75" stroke-opacity="0.5"/>
      <text font-family="'SF Mono','Fira Code','Courier New',monospace"
            font-size="11" fill="#3fb950" opacity=".85"
            x="701" y="153" text-anchor="middle">Reverse Engineering</text>
    </g>
  </g>

  <!-- ▓ CORNER METADATA — barely visible ▓ -->
  <g class="meta">
    <text font-family="'SF Mono','Fira Code','Courier New',monospace"
          font-size="10" fill="#484f58"
          x="16" y="181">github.com/h4ckologic</text>
    <text font-family="'SF Mono','Fira Code','Courier New',monospace"
          font-size="10" fill="#484f58" text-anchor="end"
          x="884" y="181">CVE-2021-31001 · CVE-2019-17221</text>
  </g>

</svg>
