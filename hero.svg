<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>

    <!-- Neon bloom glow on main title -->
    <filter id="glow" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"  result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Subtle glow for rain chars -->
    <filter id="rglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip to SVG bounds -->
    <clipPath id="bounds"><rect width="900" height="220"/></clipPath>

    <style>
      /* ── Matrix rain columns ── */
      @keyframes r1 { 0%{transform:translateY(-220px);opacity:0} 8%{opacity:.9} 85%{opacity:.5} 100%{transform:translateY(280px);opacity:0} }
      @keyframes r2 { 0%{transform:translateY(-280px);opacity:0} 12%{opacity:.7} 80%{opacity:.3} 100%{transform:translateY(280px);opacity:0} }
      @keyframes r3 { 0%{transform:translateY(-180px);opacity:0} 6%{opacity:1}  90%{opacity:.6} 100%{transform:translateY(280px);opacity:0} }

      .rc { font-family:'Courier New',Courier,monospace; font-size:12px; clip-path:url(#bounds); filter:url(#rglow); }
      .rb { fill:#00ff41; }
      .rd { fill:#00aa22; }
      .rdd{ fill:#004400; }

      .c01{animation:r1 2.7s linear infinite 0.0s}  .c02{animation:r2 3.4s linear infinite 0.3s}
      .c03{animation:r3 2.2s linear infinite 0.8s}  .c04{animation:r1 3.9s linear infinite 1.1s}
      .c05{animation:r2 2.5s linear infinite 1.6s}  .c06{animation:r3 4.2s linear infinite 0.5s}
      .c07{animation:r1 3.1s linear infinite 2.0s}  .c08{animation:r2 2.8s linear infinite 0.9s}
      .c09{animation:r3 3.7s linear infinite 1.4s}  .c10{animation:r1 2.4s linear infinite 2.3s}
      .c11{animation:r2 4.0s linear infinite 0.2s}  .c12{animation:r3 3.3s linear infinite 1.8s}
      .c13{animation:r1 2.9s linear infinite 0.6s}  .c14{animation:r2 3.6s linear infinite 1.3s}

      /* ── Scan line sweep ── */
      @keyframes scan { 0%{transform:translateY(0px);opacity:.08} 50%{opacity:.12} 100%{transform:translateY(220px);opacity:0} }
      .scanline { animation:scan 3.5s ease-in-out infinite; }

      /* ── Main title ── */
      .title { font-family:'Courier New',Courier,monospace; font-weight:bold; font-size:72px;
                fill:#00ff41; filter:url(#glow); }

      /* ── Glitch layers (RGB split) ── */
      @keyframes glR {
        0%,87%,100% { transform:translate(0,0); clip-path:none; opacity:0; }
        88%  { transform:translate(-5px,0); clip-path:polygon(0 15%,100% 15%,100% 38%,0 38%); opacity:.75; fill:#ff0044; }
        90%  { transform:translate(3px,0);  clip-path:polygon(0 55%,100% 55%,100% 75%,0 75%); opacity:.75; fill:#ff0044; }
        92%  { transform:translate(0,0);    clip-path:none; opacity:0; }
      }
      @keyframes glC {
        0%,87%,100% { transform:translate(0,0); clip-path:none; opacity:0; }
        88%  { transform:translate(5px,0);  clip-path:polygon(0 40%,100% 40%,100% 58%,0 58%); opacity:.6; fill:#00ffff; }
        91%  { transform:translate(-3px,0); clip-path:polygon(0 70%,100% 70%,100% 88%,0 88%); opacity:.6; fill:#00ffff; }
        92%  { transform:translate(0,0);    clip-path:none; opacity:0; }
      }
      .glR { font-family:'Courier New',Courier,monospace; font-weight:bold; font-size:72px;
             animation:glR 8s infinite; }
      .glC { font-family:'Courier New',Courier,monospace; font-weight:bold; font-size:72px;
             animation:glC 8s infinite 0.04s; }

      /* ── Cursor blink ── */
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cursor { font-family:'Courier New',Courier,monospace; font-weight:bold; font-size:72px;
                fill:#00ff41; filter:url(#glow); animation:blink 1s step-end infinite; }

      /* ── Subtitle ── */
      .sub  { font-family:'Courier New',Courier,monospace; font-size:14px; fill:#8b9da5; }
      .sub2 { font-family:'Courier New',Courier,monospace; font-size:11px; fill:#00ff41; opacity:.55; }

      /* ── Corner brackets ── */
      .brk { fill:none; stroke:#00ff41; stroke-width:2; opacity:.45; }

      /* ── Pulse on border ── */
      @keyframes pulse { 0%,100%{opacity:.2} 50%{opacity:.55} }
      .border-glow { fill:none; stroke:#00ff41; stroke-width:1; animation:pulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ░░ BACKGROUND ░░ -->
  <rect width="900" height="220" fill="#0d1117"/>

